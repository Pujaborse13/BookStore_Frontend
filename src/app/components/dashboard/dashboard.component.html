<div class="dashboard-container">
    
    <!-- Top Navbar -->
    <div class="navbar">
      <!-- Logo Section -->
      <div class="logo" (click)="goToHome()" style="cursor: pointer;">
        <img src="assets/education.png" alt="Bookstore Logo" />
        <span>Bookstore</span>
      </div>
  
      <!-- Search Bar Section -->
      <div class="search-bar">
        <div class="search-container">
          <mat-icon>search</mat-icon>
          <input type="text" placeholder="Search ..." [(ngModel)]="searchTerm"(ngModelChange)="onSearchChange($event)"/>
          <!-- <input type="text" placeholder="Search ..." [(ngModel)]="searchTerm" /> -->
        </div>
      </div>
  
      <!-- Right-side Icons -->
       <div class="nav-actions">
      
    <!-- Profile Menu -->
      <div class="nav-item profile-menu" [matMenuTriggerFor]="profileMenu">
        <mat-icon class="material-icons-outlined">person</mat-icon>
        <span>{{ userName }}</span>
      </div>


      <!-- profile click options  -->
      <mat-menu #profileMenu="matMenu">
        <div class="menu-header">Hello {{ userName }},</div>
        
        <!-- <button mat-menu-item (click)="goToProfile()">
          <mat-icon>person</mat-icon>
          <span>Profile</span>
        </button> -->

        <button mat-menu-item (click)="goToOrders()">
          <mat-icon class="material-icons-outlined">shopping_bag</mat-icon>
          <span>My Orders</span>
        </button>

        <button mat-menu-item (click)="goToWishlist()">
          <mat-icon class="material-icons-outlined">favorite</mat-icon>
          <span>Wishlist</span>
        </button>
        
        <div class="custom-logout-wrapper">
          <button mat-button class="logout-button" (click)="logout()">Logout</button>
        </div>
        

      </mat-menu>


        <!-- Cart icon -->
        <div class="nav-item cart-menu" (click)="goToCart()">
          <mat-icon class="material-icons-outlined" matBadge="{{ cartItemCount }}"
                    matBadgeColor="accent"
                    matBadgeOverlap="false"
                    [matBadgeHidden]="cartItemCount === 0">
            shopping_cart
          </mat-icon>
          <span>Cart</span>
        </div>
    </div>
  </div>

    <!-- Main Content Placeholder -->
    <div class="main-content">
      <router-outlet></router-outlet>  

      <!-- <app-books [searchTerm]= "searchTerm"></app-books> -->
      <!-- <app-book-details></app-book-details> -->
      
    </div>
  
    
    <!-- Footer -->
    <footer class="footer">
      <p>Copyright © 2020, Bookstore Private Limited. All Rights Reserved</p>
    </footer>

   

  </div>

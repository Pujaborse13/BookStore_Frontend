<div *ngIf="book" class="book-details-container">

   <!-- home / cart -->
    <div class="breadcrumb">
      <span class="breadcrumb-link" (click)="goToDashboard()">Home</span> /<span class="current-page">Book({{ book.id }})</span>
    </div>
      
      <div class="book-content">

        <!-- Left Section: Book Image and Thumbnail -->  
          <div class="thumbnails">
            <img [src]="book.bookImage" alt="thumb1" class="thumbnail" />
          </div>

        <div class="image-section">
          <img [src]="book.bookImage" alt="{{ book.bookName }}" class="main-image" />

          <div class="action-buttons">
            <ng-container *ngIf="book.quantity === 0; else addToCartBlock">
              <button class="btn add-to-bag" (click)="notifyMe()">NOTIFY ME</button>
            </ng-container>
            
            <ng-template #addToCartBlock>
                <ng-container *ngIf="!isInCart; else quantityBlock">
                  <button class="btn add-to-bag" (click)="addToCart(book.id)">ADD TO BAG</button>
                </ng-container>
            </ng-template>
            
            <ng-template #quantityBlock>
              <div class="quantity-container">
                <button class="qty-btn" (click)="updateQuantity('dec')">−</button>
                <span class="quantity-value">{{ quantity }}</span>
                <button class="qty-btn" (click)="updateQuantity('inc')">+</button>
              </div>
            </ng-template>

            <button class="btn wishlist" (click)="addToWishlist(book.id)"> ❤ WISHLIST</button>
          </div>
        </div>
    
        <!-- Right Section: Book Details -->
        <div class="details-section">
          <h2>{{ book.bookName }}</h2>
          <p class="author">by {{ book.author }}</p>

          <div class="rating-price">
            <span class="rating-value"> 4.5 <mat-icon class="star-icon">star</mat-icon></span>
            <span class="rating-count">(20)</span>
          </div>  

          <div class="price">
              <span class="discount-price">Rs. {{ book.discountPrice }}</span>
              <span class="original-price">Rs. {{ book.price }}</span>
          </div>
          
          <hr class="separator" />
    
          <!-- Book Detail Section -->
          <h3 class="section-heading">Book Detail</h3>
          <p class="description">{{ book.description }}</p>

          <hr class="separator" />

          <div class="feedback">
            <h3 class="section-heading"> Customer Feedback</h3>
            <p>Overall rating</p>
            
            <!-- Star Rating Loop -->
            <div class="stars">
              <ng-container *ngFor="let star of [1,2,3,4,5]">
                <mat-icon class="star-outline">star_outline</mat-icon>
              </ng-container>
            </div>
          
            <textarea placeholder="Write your review"></textarea>
            <!-- <button class="btn submit">Submit</button> -->
            <div class="submit-container">
              <button class="btn submit">Submit</button>
            </div>
            
          </div>
         
        </div>
      </div>
    </div>

  <div class="breadcrumb">
    <span class="breadcrumb-link" (click)="goToDashboard()">Home</span> /
    <span class="current-page">My Wishlist</span>
  </div>
  
  <div class="wishlist-wrapper">

    <div class="wishlist-container">
      <mat-card class="wishlist-header">
        <h2>My Wishlist ({{ books.length }})</h2>
      </mat-card>
  
       <!--  Show this message when wishlist is empty -->
    <div *ngIf="books.length === 0" class="empty-message">
      <mat-card class="empty-card">
      <img src="assets/images/Ewishlist.png" alt="wishlist empty" class="emptywishlist-image" />
        <h2>Your wishlist is Empty!</h2>
        <p>Explore more and shortlist some items<p>
        <button mat-raised-button color="warn" routerLink="/dashboard/books">Explore</button>
      </mat-card>
    </div>


      <div *ngFor="let book of books" class="wishlist-item">
        <mat-card class="book-card">
          <div class="book-info">
            <img [src]="book.bookImage" alt="{{ book.bookName }}" class="book-image" />
            <div class="book-details">
              <h3>{{ book.bookName }}</h3>
              <p class="author">by {{ book.author }}</p>
              <div class="price">
                <span class="discount-price">Rs. {{ book.discountPrice }}</span>
                <span class="original-price">Rs. {{ book.price }}</span>
              </div>
            </div>
          </div>
  
        <!-- <div class="delete-container"> -->
          <button mat-icon-button class="delete-button" (click)="removeFromWishlist(book.bookId)">
            <mat-icon class="material-icons-outlined">delete</mat-icon>
          </button>
        <!-- </div> -->
        
        </mat-card>
      </div>
    </div>
  </div>
